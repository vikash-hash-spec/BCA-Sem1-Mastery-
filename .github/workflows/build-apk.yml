name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Gradle can run
        run: |
          if [ ! -f ./gradlew ]; then
            echo '#!/bin/sh' > ./gradlew
            echo 'if command -v gradle >/dev/null 2>&1; then' >> ./gradlew
            echo '  exec gradle "$@"' >> ./gradlew
            echo 'elif [ -f "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" ]; then' >> ./gradlew
            echo '  exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> ./gradlew
            echo 'else' >> ./gradlew
            echo '  echo "Gradle not found" >&2' >> ./gradlew
            echo '  exit 1' >> ./gradlew
            echo 'fi' >> ./gradlew
          fi
          chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK with assembleDebug
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
